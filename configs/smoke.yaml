name: smoke
data:
  train_path:
  - data/dev/n1/train.parquet
  - data/dev/n2/train.parquet
  - data/dev/n3/train.parquet
  val_path:
  - data/dev/n1/val.parquet
  - data/dev/n2/val.parquet
  - data/dev/n3/val.parquet
  test_path:
  - data/dev/n1/test.parquet
  - data/dev/n2/test.parquet
  - data/dev/n3/test.parquet
  n_inputs: 64
  train_limit_per_path: null
  t1_min: 50.0
  t1_max: 4000.0
  t2_min: 5.0
  t2_max: 3000.0
model:
  input_dim: 64
  hidden_dim: 128
  fs_dim: 64
  n_queries: 10
  n_dlayers: 2
  n_heads: 4
  aux_loss: false
  exist_head: joint
loss:
  t1_weight: 1.0
  t2_weight: 1.0
  w_weight: 1.0
  exist_weight: 0.1
  aux_weight: 1.0
  t1_t2_weighting: uniform
  signal_consistency: false
  signal_consistency_weight: 0.0
  signal_consistency_target: noisy
  signal_consistency_warmup_epochs: 0
train:
  epochs: 3
  batch_size: 256
  lr: 0.0003
  weight_decay: 0.0001
  opt_betas:
  - 0.9
  - 0.98
  early_stopping: true
  early_stopping_patience: 10
  early_stopping_min_delta: 1.0e-05
  lr_scheduler: constant
  scheduler_factor: 0.5
  scheduler_patience: 7
  scheduler_min_lr: 1.0e-06
  gradient_clip_norm: 1.0
  device: null
  seed: 0
  num_workers: 0
evaluation:
  calibrate_threshold: true
  fixed_threshold: 0.5
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_steps: 19
notes: |
  A small, fast configuration for the development dataset the test suite generates. It
  exists so the pipeline can be run end to end right after cloning, without generating a
  full dataset first.

  It is not a scientific configuration: the model is a quarter of the reported size and it
  trains for three epochs on a few thousand voxels. Do not quote numbers from it.
