name: physics_noisy
data:
  train_path:
  - data/t1_3500_t2_500_100k/n1/train.parquet
  - data/t1_3500_t2_500_100k/n2/train.parquet
  - data/t1_3500_t2_500_100k/n3/train.parquet
  val_path:
  - data/t1_3500_t2_500_100k/n1/val.parquet
  - data/t1_3500_t2_500_100k/n2/val.parquet
  - data/t1_3500_t2_500_100k/n3/val.parquet
  test_path:
  - data/t1_3500_t2_500_100k/n1/test.parquet
  - data/t1_3500_t2_500_100k/n2/test.parquet
  - data/t1_3500_t2_500_100k/n3/test.parquet
  n_inputs: 64
  train_limit_per_path: null
  t1_min: 50.0
  t1_max: 3500.0
  t2_min: 5.0
  t2_max: 500.0
model:
  input_dim: 64
  hidden_dim: 512
  fs_dim: 256
  n_queries: 10
  n_dlayers: 4
  n_heads: 4
  aux_loss: false
  exist_head: joint
loss:
  t1_weight: 1.0
  t2_weight: 1.0
  w_weight: 1.0
  exist_weight: 0.1
  aux_weight: 1.0
  t1_t2_weighting: signal_fraction
  signal_consistency: true
  signal_consistency_weight: 1.0
  signal_consistency_target: noisy
  signal_consistency_warmup_epochs: 10
train:
  epochs: 500
  batch_size: 512
  lr: 0.0001
  weight_decay: 0.0001
  opt_betas:
  - 0.9
  - 0.98
  early_stopping: true
  early_stopping_patience: 35
  early_stopping_min_delta: 1.0e-05
  lr_scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 7
  scheduler_min_lr: 1.0e-06
  gradient_clip_norm: 1.0
  device: null
  seed: 20260724
  num_workers: 4
evaluation:
  calibrate_threshold: true
  fixed_threshold: 0.5
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_steps: 91
notes: |
  Changed: the signal-consistency term is switched on with the noisy input signal as its
  target (three fields: signal_consistency, its weight and its warmup). Data, model,
  optimiser, seed and selection metric match baseline_v2_reproduction.

  The prediction is pushed back through the differentiable forward model and the mismatch
  with the measured signal is penalised. Because the target is the network's own input, the
  term needs no ground truth and would carry over to real scans unchanged. The noise is
  zero-mean, so the gradient is unbiased and the loss floor is the per-voxel noise power.

  See docs/physics-loss.md.
