name: final_uniform_q6
data:
  train_path:
  - data/t1_3500_t2_500_100k/n1/train.parquet
  - data/t1_3500_t2_500_100k/n2/train.parquet
  - data/t1_3500_t2_500_100k/n3/train.parquet
  val_path:
  - data/t1_3500_t2_500_100k/n1/val.parquet
  - data/t1_3500_t2_500_100k/n2/val.parquet
  - data/t1_3500_t2_500_100k/n3/val.parquet
  test_path:
  - data/t1_3500_t2_500_100k/n1/test.parquet
  - data/t1_3500_t2_500_100k/n2/test.parquet
  - data/t1_3500_t2_500_100k/n3/test.parquet
  n_inputs: 64
  train_limit_per_path: null
  t1_min: 50.0
  t1_max: 3500.0
  t2_min: 5.0
  t2_max: 500.0
model:
  input_dim: 64
  hidden_dim: 512
  fs_dim: 256
  n_queries: 6
  n_dlayers: 4
  n_heads: 4
  aux_loss: false
loss:
  t1_weight: 1.0
  t2_weight: 1.0
  w_weight: 1.0
  exist_weight: 0.1
  aux_weight: 1.0
  t1_t2_weighting: uniform
  signal_consistency: false
  signal_consistency_weight: 0.0
train:
  epochs: 500
  batch_size: 512
  lr: 0.0001
  weight_decay: 0.0001
  opt_betas:
  - 0.9
  - 0.98
  early_stopping: true
  early_stopping_patience: 35
  early_stopping_min_delta: 1.0e-05
  lr_scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 7
  scheduler_min_lr: 1.0e-06
  gradient_clip_norm: 1.0
  device: null
  seed: 20260724
  num_workers: 4
evaluation:
  calibrate_threshold: true
  fixed_threshold: 0.5
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_steps: 91
notes: |
  Uniform weighting with six queries. Two changes relative to baseline_v2_reproduction, each
  backed by its own single-change run: loss.t1_t2_weighting signal_fraction -> uniform, and
  model.n_queries 10 -> 6. Nothing else changed.

  Why these two: loss_uniform is the only arm that moved the threshold-free mAP@7, and it
  lifted the hardest regime most. queries_6 gained strict accuracy at both declared
  thresholds with no measured mAP loss. The two act on different failures, placement and
  spurious proposals, so they were candidates for being additive.

  Trained at the same four seeds as the reference (20260724 to 20260727), so the comparison
  is four runs against four. The seed runs are configs/seeds/final_uniform_q6_seed<seed>.yaml
  and their results are results/final_uniform_q6_seed<seed>/.

  Criteria, fixed before any of the four runs and judged on the means over the seeds:
    (a) beats the reference on strict accuracy at both declared thresholds by more than the
        ruler (1.95 pp at 0.50, 0.98 pp at 0.75)
    (b) does not fall below loss_uniform on mAP@7 by more than the seed spread, 0.0168
    (c) does not fall below loss_uniform on K=3 strict accuracy by more than the ruler

  How the outcome was to be read, also fixed in advance: beating loss_uniform at both
  thresholds means the gains are additive and this is the final model; matching it within
  the ruler means the query cut is redundant once the loss is fixed, and loss_uniform is
  reported as final because it is the simpler recipe; falling below it means the two
  interact negatively.

  Outcome: 60.76 % strict accuracy against 61.43 % for loss_uniform, mAP@7 0.7452 against
  0.7635. The combination is not additive, and loss_uniform alone is the final model.
