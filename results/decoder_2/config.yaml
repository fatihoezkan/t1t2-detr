name: decoder_2
data:
  train_path:
  - data/t1_3500_t2_500_100k/n1/train.parquet
  - data/t1_3500_t2_500_100k/n2/train.parquet
  - data/t1_3500_t2_500_100k/n3/train.parquet
  val_path:
  - data/t1_3500_t2_500_100k/n1/val.parquet
  - data/t1_3500_t2_500_100k/n2/val.parquet
  - data/t1_3500_t2_500_100k/n3/val.parquet
  test_path:
  - data/t1_3500_t2_500_100k/n1/test.parquet
  - data/t1_3500_t2_500_100k/n2/test.parquet
  - data/t1_3500_t2_500_100k/n3/test.parquet
  n_inputs: 64
  train_limit_per_path: null
  normalization: log_minmax
  t1_min: 50.0
  t1_max: 3500.0
  t2_min: 5.0
  t2_max: 500.0
  signal_norm: max
model:
  input_dim: 64
  hidden_dim: 512
  fs_dim: 256
  n_queries: 10
  n_dlayers: 2
  n_heads: 4
  aux_loss: false
  exist_head: joint
  pretrain_path: null
  freeze_encoder: false
loss:
  t1_weight: 1.0
  t2_weight: 1.0
  w_weight: 1.0
  exist_weight: 0.1
  aux_weight: 1.0
  t1_t2_weighting: signal_fraction
  signal_consistency: false
  signal_consistency_weight: 0.0
  signal_consistency_type: mse
train:
  epochs: 500
  batch_size: 512
  lr: 0.0001
  weight_decay: 0.0001
  opt_betas:
  - 0.9
  - 0.98
  early_stopping: true
  early_stopping_patience: 35
  early_stopping_min_delta: 1.0e-05
  selection_metric: parameter_loss
  lr_scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 7
  scheduler_min_lr: 1.0e-06
  gradient_clip_norm: 1.0
  device: null
  seed: 20260724
  num_workers: 4
  ckpt_every: 1
evaluation:
  calibrate_threshold: true
  fixed_threshold: 0.5
  threshold_objective: parameter_set_error
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_steps: 91
notes: "CHANGED: model.n_dlayers  4 -> 2.  Nothing else.\n\nDecoder depth is how many\
  \ rounds of attention each query gets over the encoded signal before it\nmust commit\
  \ to a compartment. More layers mean more chances to refine a guess and to coordinate\n\
  with the other queries through self-attention; fewer mean a shallower, cheaper,\
  \ faster model.\nHalving depth removes roughly 1.6 M parameters (two nn.TransformerDecoderLayer\
  \ blocks at\nfs_dim=256, dim_feedforward=512).\n\nThis replicates an ablation Johannes\
  \ ran in the prior thesis, which is its main value: a\nreplication on our dataset\
  \ and our loss either confirms his depth conclusion transfers or shows\nit does\
  \ not. Read it together with decoder_6 as a three-point depth curve over 2, 4, 6.\n\
  \nHypothesis: modest degradation. The task is 64 numbers in, at most 3 compartments\
  \ out, and the\nencoder is already a 4-layer MLP, so 2 decoder layers may well be\
  \ enough.\n\nMeasurement: t1_rel_median / t2_rel_median and count_accuracy (baseline\
  \ 5.63 % / 6.90 % / 78.54 %)\nagainst wall_seconds from summary.json (baseline 1639\
  \ s). POSITIVE (metrics hold): depth 4 is\nover-provisioned and the model can be\
  \ halved \u2014 a clean efficiency result, and a genuine finding\neven though nothing\
  \ improved. NEGATIVE (metrics degrade): depth is doing real work, and the curve\n\
  over 2/4/6 shows where the return flattens.\n"
