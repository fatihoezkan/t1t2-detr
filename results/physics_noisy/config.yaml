name: physics_noisy
data:
  train_path:
  - data/t1_3500_t2_500_100k/n1/train.parquet
  - data/t1_3500_t2_500_100k/n2/train.parquet
  - data/t1_3500_t2_500_100k/n3/train.parquet
  val_path:
  - data/t1_3500_t2_500_100k/n1/val.parquet
  - data/t1_3500_t2_500_100k/n2/val.parquet
  - data/t1_3500_t2_500_100k/n3/val.parquet
  test_path:
  - data/t1_3500_t2_500_100k/n1/test.parquet
  - data/t1_3500_t2_500_100k/n2/test.parquet
  - data/t1_3500_t2_500_100k/n3/test.parquet
  n_inputs: 64
  train_limit_per_path: null
  normalization: log_minmax
  t1_min: 50.0
  t1_max: 3500.0
  t2_min: 5.0
  t2_max: 500.0
  signal_norm: max
model:
  input_dim: 64
  hidden_dim: 512
  fs_dim: 256
  n_queries: 10
  n_dlayers: 4
  n_heads: 4
  aux_loss: false
  exist_head: joint
  pretrain_path: null
  freeze_encoder: false
loss:
  t1_weight: 1.0
  t2_weight: 1.0
  w_weight: 1.0
  exist_weight: 0.1
  aux_weight: 1.0
  t1_t2_weighting: signal_fraction
  signal_consistency: true
  signal_consistency_weight: 1.0
  signal_consistency_type: mse
  signal_consistency_target: noisy
  signal_consistency_warmup_epochs: 10
train:
  epochs: 500
  batch_size: 512
  lr: 0.0001
  weight_decay: 0.0001
  opt_betas:
  - 0.9
  - 0.98
  early_stopping: true
  early_stopping_patience: 35
  early_stopping_min_delta: 1.0e-05
  selection_metric: parameter_loss
  lr_scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 7
  scheduler_min_lr: 1.0e-06
  gradient_clip_norm: 1.0
  device: null
  seed: 20260724
  num_workers: 4
  ckpt_every: 1
evaluation:
  calibrate_threshold: true
  fixed_threshold: 0.5
  threshold_objective: parameter_set_error
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_steps: 91
notes: "PHYSICS ARM (self-supervised) \u2014 one change: the signal-consistency term\
  \ is switched on with\nthe NOISY input signal as its target. Everything else (data,\
  \ model, optimizer, seed, selection\nmetric) is identical to baseline_v2_reproduction.\n\
  \nHypothesis: resynthesizing the signal from the prediction through the differentiable\
  \ IR-MSE\nforward and penalizing the mismatch opens a supervision channel that does\
  \ not depend on the\nsignal-fraction weighting of the Hungarian term. If poor small-compartment\
  \ recovery is a loss\nartifact, the physics term should improve weight-resolved\
  \ detection and relative T1 error in\nthe low-weight bands. If it is an information\
  \ limit of the protocol, metrics should not move.\n\nMeasurement: metrics_detr.json\
  \ weight-resolved blocks vs baseline_v2_reproduction, primarily\ndetection rate\
  \ and relative T1 error for w in [0.05,0.10) and [0.10,0.25). Secondary: query\n\
  usage (does the physics gradient on the existence head change collapse behavior),\
  \ calibrated\nthreshold, and the raw `sc` validation curve.\n\nRead PHYSICS_METHODS.md\
  \ before interpreting either outcome \u2014 both are informative.\n"
